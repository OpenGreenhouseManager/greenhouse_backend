name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "greenhouse_core/**"
      - "greenhouse_macro/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        run: |
          rustup update nightly
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rust-src

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: |
          cargo doc \
            --package greenhouse_core \
            --package greenhouse_macro \
            --all-features \
            --no-deps
        env:
          RUSTDOCFLAGS: "--cfg docsrs -D warnings"

      - name: Add redirect index
        run: |
          printf '<meta http-equiv="refresh" content="0; url=greenhouse_core/index.html">' \
            > target/doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

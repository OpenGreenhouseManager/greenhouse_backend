name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  LDPROXY_VERSION: "0.3.4"

permissions:
  contents: read

jobs:
  typos:
    name: Typo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      - run: typos

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly rustfmt
        run: |
          rustup update nightly
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check --color always

  sort:
    name: Dependency Sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - name: Check dependency sort
        run: cargo sort --workspace --grouped --check

  rust-checks:
    name: Build / Clippy / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly components
        run: |
          rustup update nightly
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rust-src clippy
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Cache ldproxy binary
        uses: actions/cache@v4
        id: cache-ldproxy
        with:
          path: ~/.cargo/bin/ldproxy
          key: ldproxy-${{ runner.os }}-${{ env.LDPROXY_VERSION }}
      - name: Install ldproxy
        if: steps.cache-ldproxy.outputs.cache-hit != 'true'
        run: cargo install ldproxy --version ${{ env.LDPROXY_VERSION }} --locked
      - name: Build
        run: cargo build --release --workspace
      - name: Clippy
        run: cargo clippy --all-targets --all-features --workspace -- -D warnings
      - name: Test
        run: cargo test --release --workspace --all-features -- --test-threads=1

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run security audit
        # RUSTSEC-2025-0111: tokio-tar PAX header flaw. Transitive dev-only dep
        # via testcontainers->bollard. Not in production binaries. No upstream
        # patch exists yet; ignore until bollard migrates to astral-tokio-tar.
        # RUSTSEC-2026-0136: COPY FROM/TO command injection in Diesel. This
        # project never calls COPY FROM/TO; not exploitable. Fix: diesel >=2.3.8.
        # Tracked for upgrade in a dedicated PR (diesel-async 0.5→0.9 is breaking).
        # RUSTSEC-2026-0137: SQLite SqliteAggregate unaligned access in Diesel.
        # This project uses PostgreSQL only; SQLite backend never compiled in.
        # Fix: diesel >=2.3.8. Same upgrade PR as RUSTSEC-2026-0136.
        run: cargo audit --ignore RUSTSEC-2025-0111 --ignore RUSTSEC-2026-0136 --ignore RUSTSEC-2026-0137

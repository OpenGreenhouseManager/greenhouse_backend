[workspace]
resolver = "2"
members = [
    "api/script",
    "api/web",
    "examples",
    "greenhouse_core", "integration-tests",
    "services/auth_service",
    "greenhouse_macro",
    "services/data_storage_service",
    "services/device_service",
    "services/scripting_service",
]
default-members = [
    "api/web",
    "api/script",
    "services/auth_service",
    "services/device_service",
    "services/data_storage_service",
    "services/scripting_service",
    "greenhouse_core",
]

[workspace.dependencies]
axum = { version = "0.8.8", features = ["macros", "tracing"] }
derive_more = {version = "2.1.1", features = ["full"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
reqwest = {version = "0.13.1", features = ["query"]}
serde = { version = "1.0.228", features = ["serde_derive"] }
greenhouse_core = { path = "./greenhouse_core" }
greenhouse_macro = { path = "./greenhouse_macro" }
serde_json = "1.0.149"
serde_yaml = "0.9.34+deprecated"
bb8 = "0.9.1"
diesel = "2.3.6"
diesel-async = { version = "0.7.4", features = ["postgres", "bb8"] }
uuid = "1.20.0"
bcrypt = "0.18.0"
rand = "0.9.2"
jsonwebtoken = {version = "10.3.0", features = ["rust_crypto"]}
chrono = { version = "0.4.43", features = ["serde"]  }
diesel_migrations = "2.3.1"
tower-cookies = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tower-http = { version = "0.6.8", features = ["trace"] }
sentry = "0.46.1"
futures = "0.3.31" 
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

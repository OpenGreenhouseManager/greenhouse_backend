[workspace]
resolver = "2"
members = [
    "api/script",
    "api/web",
    "examples",
    "greenhouse_core",
    "greenhouse_macro",
    "integration-tests",
    "services/auth_service",
    "services/data_storage_service",
    "services/device_service",
    "services/scripting_service",
]
default-members = [
    "api/web",
    "api/script",
    "services/auth_service",
    "services/device_service",
    "services/data_storage_service",
    "services/scripting_service",
    "greenhouse_core",
]

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "tracing"] }
bb8 = "0.9.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
derive_more = { version = "2.1.1", features = ["full"] }
diesel = "2.3.14"
diesel-async = { version = "0.9.2", features = ["postgres", "bb8"] }
diesel_migrations = "2.3.2"
futures = "0.3.34" 
greenhouse_core = { path = "./greenhouse_core" }
greenhouse_macro = { path = "./greenhouse_macro" }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["charset", "http2", "native-tls", "query", "system-proxy"] }
sentry = "0.49.3"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1"
uuid = "1.28.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "greenhouse_macro"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for the OpenGreenhouseManager backend (JWT auth attribute + JSON response derive)"
license = "GPL-3.0"
repository = "https://github.com/OpenGreenhouseManager/greenhouse_backend"
homepage = "https://github.com/OpenGreenhouseManager/greenhouse_backend"
documentation = "https://docs.rs/greenhouse_macro"
keywords = ["greenhouse", "macro", "axum", "jwt", "proc-macro"]
categories = ["web-programming"]

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc_macro_tools = "0.1.17"
quote = "1"
syn = { version = "1.0.109", features = ["full"] }

axum = { workspace = true }

[package]
name = "greenhouse_core"
version = "0.2.0"
edition = "2024"
description = "Shared DTOs and smart-device interface for the OpenGreenhouseManager backend"
license = "GPL-3.0"
repository = "https://github.com/OpenGreenhouseManager/greenhouse_backend"
homepage = "https://github.com/OpenGreenhouseManager/greenhouse_backend"
documentation = "https://docs.rs/greenhouse_core"
keywords = ["greenhouse", "iot", "smart-device", "axum", "dto"]
categories = ["embedded", "web-programming", "data-structures"]

[features]
default = [
    "api_web_dto",
    "api_script_dto",
    "auth_service_dto",
    "smart_device_dto",
    "smart_device_interface",
    "data_storage_service_dto",
    "device_service_dto",
    "error_handling",
    "scripting_service_dto",
]
api_web_dto = []
api_script_dto = []
auth_service_dto = []
smart_device_dto = []
smart_device_interface = ["smart_device_dto", "dep:axum", "dep:tracing", "dep:reqwest"]
data_storage_service_dto = []
device_service_dto = []
error_handling = ["dep:axum", "dep:tracing"]
scripting_service_dto = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
axum = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"] }
derive_more = { workspace = true }
futures = { workspace = true }
greenhouse_macro = { version = "0.1", path = "../greenhouse_macro" }
reqwest = { workspace = true, features = ["json"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
    "serde",
] }

[dev-dependencies]
httpc-test = "0.1.9"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "dto_construction"
required-features = ["auth_service_dto", "device_service_dto", "data_storage_service_dto"]

[[example]]
name = "smart_device_types"
required-features = ["smart_device_dto"]

[[example]]
name = "device_builder_minimal"
required-features = ["smart_device_interface"]

[[example]]
name = "http_error_mapping"
required-features = ["error_handling"]

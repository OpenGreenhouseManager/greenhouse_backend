[package]
name = "examples"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
derive_more = { version = "2.1.1", features = ["full"] }
greenhouse_core = { path = "../greenhouse_core" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_derive = "1.0.229"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "input_output_int_saver"
path = "input_output_int_saver.rs"
[[example]]
name = "input_alert_trigger"
path = "input_alert_trigger.rs"
[[example]]
name = "periodic_alert"
path = "periodic_alert.rs"
